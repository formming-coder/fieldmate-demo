name = "fieldmate-api"
main = "src/index.ts"
compatibility_date = "2026-08-07"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "fieldmate"
database_id = "replace-with-d1-id"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "fieldmate-assets"

[vars]
ENVIRONMENT = "development"
CORS_ORIGIN = "http://localhost:5173"
JWT_AUDIENCE = "fieldmate-api"
JWT_ISSUER = "https://login.microsoftonline.com/common/v2.0"
JWT_SECRET = "replace-me"
ENTRA_TENANT_ID = "common"
ENTRA_CLIENT_ID = ""
ENTRA_CLIENT_SECRET = ""
ENTRA_REDIRECT_URI = "http://localhost:5173/auth/callback"
